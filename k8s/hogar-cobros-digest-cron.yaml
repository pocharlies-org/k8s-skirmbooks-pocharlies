# Digest diario de MOVIMIENTOS BANCARIOS NUEVOS — tenant `family` (Hogar) →
# topic "🏦 Banca" del grupo Telegram hogar (-1003749364241).
#
# El hogar es un tenant con profile='personal': NO presenta impuestos y no tiene
# bucle de conciliación de facturas. Lo que necesita es auditar QUÉ COBROS entran
# (y de paso el pulso del gasto). Entrypoint `synapse_adapter_banking.cobros_digest`.
#
# Horario: 07:20 UTC, encadenado detrás del import PSD2
# (skirmbooks-banking-daily-sync 06:40) y del reauth-check (07:10). No hay vía por
# EVENTO: `banking.<tenant>.movement.imported` existe como trigger de workflow pero
# ningún handler lo emite, y los movimientos solo entran cuando corre ese import,
# así que el cron es tan inmediato como los datos permiten.
#
# ANTI-AVALANCHA (crítico): el predicado de "nuevo" NO es temporal, es la marca por
# movimiento en gestoria_banking.movement_alert_log (migración 0078). Los
# movimientos entran en LOTES de import: los 129 históricos de `family` se
# importaron todos el 2026-07-21 22:53, así que un `created_at > now()-24h` habría
# disparado 95 avisos de golpe. La PRIMERA corrida hace backfill silencioso y manda
# un único mensaje de activación.
#
# El topic "🏦 Banca" se auto-crea por clave (topic_resolver, con advisory lock) la
# primera vez. NO se reutiliza el thread 5518 ("Facturas"): ese ya es del digest de
# `moreno`, y el PK del mapa de topics es (tenant_id, chat_id, map_key).
#
# Smoke seguro contra producción: COBROS_DRY_RUN=1 (no publica NI marca).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: skirmbooks-hogar-cobros-digest
  namespace: skirmshop
  labels:
    app: skirmbooks-hogar-cobros-digest
    app.kubernetes.io/part-of: skirmbooks
spec:
  schedule: "20 7 * * *"          # 07:20 UTC — tras daily-sync (06:40) y reauth-check (07:10)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: skirmbooks-hogar-cobros-digest
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          imagePullSecrets:
          - name: harbor-pull
          tolerations:
          - key: role
            operator: Equal
            value: edge
            effect: NoSchedule
          containers:
          - name: cobros-digest
            image: harbor.e-dani.com/homelab/skirmbooks-backend:hogar-cobros-20260722-delta@sha256:2db11134ffa57a7bbc206be39270936f2dcbec940beb62744d262fb152862aa6
            command: ["python", "-m", "synapse_adapter_banking.cobros_digest"]
            env:
            # El tenant del hogar se llama `family`, NO `personal`: KNOWN_TENANTS
            # de synapse_shared lo rechazaría y el comando iría a dead-letter.
            - name: COBROS_TENANT
              value: family
            - name: COBROS_CHAT_ID
              value: "-1003749364241"
            - name: COBROS_TOPIC_KEY
              value: "static:banca"
            - name: COBROS_TOPIC_NAME
              value: "🏦 Banca"
            - name: COBROS_DRY_RUN
              value: "0"
            resources:
              requests: { cpu: "25m", memory: "96Mi" }
              limits: { cpu: "250m", memory: "256Mi" }
            volumeMounts:
            - name: config
              mountPath: /etc/synapse/adapter-gestoria-banking.yaml
              subPath: adapter-gestoria-banking.yaml
            - name: credentials
              mountPath: /etc/synapse/credentials
          volumes:
          - name: config
            configMap:
              name: skirmbooks-banking-config
          - name: credentials
            secret:
              secretName: skirmbooks-backend-secrets
