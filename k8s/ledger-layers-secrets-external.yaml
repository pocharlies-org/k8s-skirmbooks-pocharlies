# skirmbooks-ledger-layers-secrets ← 1Password (ESO, forma Connect)
# =============================================================================
# El token de servicio de la API de ledger-layers (SKIRM-182 · C1.5 y C1.9).
# Item `skirmbooks-ledger-layers` del vault `k8s-pocharlies`, campo
# LEDGER_LAYERS_API_TOKEN, escrito por el rol security: ESO solo lee, la siembra
# es el CLI `op` (runbook docs/p1-vault-eso/).
#
# Forma Connect (ARCHITECTURE.md §4 de k8s-infra-pocharlies): remoteRef `key` =
# item y `property` = campo, store `onepassword-connect`. Por Connect no se gasta
# el cupo diario de la cuenta de 1Password. `refreshPolicy: OnChange` es lo que
# fija la política Kyverno externalsecret-onepassword-onchange para los stores de
# 1Password; con OnChange el Secret se re-sincroniza al cambiar el spec, y un
# cambio de valor en el item se trae con la etiqueta `force-sync`.
#
# FAIL-CLOSED, y por eso el Deployment lo consume con `optional: true`
# (k8s/ledger-layers.yaml): sin token el servicio responde 503 a todo lo que toca
# datos y deja abiertos /healthz, /docs y /openapi.json. Así, si el item falta,
# el pod sigue Ready (las sondas van por /healthz) y la API queda cerrada, en vez
# de un CreateContainerConfigError que además bloquearía el sync de ArgoCD.
#
# deletionPolicy: Retain → borrar este ExternalSecret no borra el Secret.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmbooks-ledger-layers-secrets
  namespace: skirmshop
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: skirmbooks-ledger-layers-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LEDGER_LAYERS_API_TOKEN
      remoteRef:
        key: skirmbooks-ledger-layers
        property: LEDGER_LAYERS_API_TOKEN
