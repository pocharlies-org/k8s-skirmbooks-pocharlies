        - name: SYNAPSE_ADAPTER_GESTORIA_SII_INBOUND_CONFIG
          value: /etc/synapse/adapter-gestoria-sii-inbound.yaml
        - name: SYNAPSE_COMMAND_ACTIONS
          # reconcile_aeat (libro nuestro vs AEAT) + import_recibidas / import_emitidas
          # (import de los libros REMOTOS de la gestoría → gestoria_audit.*_ledger).
          # Los tres consultan AEAT con mTLS → necesitan el cert sii-certificate.
          # OJO: la variable PRESENTE restringe el binding. Quitar una acción de esta
          # lista la desbindea activamente (_unbind_legacy_command_actions), así que
          # aquí solo se añade.
          value: reconcile_aeat,import_recibidas,import_emitidas
        ports:
        - name: metrics
          containerPort: 9530
        volumeMounts:
        - name: config
          mountPath: /etc/synapse/adapter-gestoria-sii-inbound.yaml
          subPath: adapter-gestoria-sii-inbound.yaml
          readOnly: true
        - name: credentials
          mountPath: /etc/synapse/credentials
          readOnly: true
        # Cert FNMT del sii-app (consulta SII vía mTLS). Secret sii-certificate
        # → /etc/synapse/aeat/sii.p12 + /etc/synapse/aeat/passphrase.
        - name: aeat-cert
          mountPath: /etc/synapse/aeat
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 768Mi
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - grep -q synapse_adapter /proc/1/cmdline
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: config
        configMap:
          name: skirmbooks-sii-inbound-config
          items:
          - key: adapter-gestoria-sii-inbound.yaml
            path: adapter-gestoria-sii-inbound.yaml
      - name: credentials
        secret:
          secretName: skirmbooks-backend-secrets
          defaultMode: 292
      - name: aeat-cert
        secret:
          secretName: sii-certificate
          defaultMode: 292
