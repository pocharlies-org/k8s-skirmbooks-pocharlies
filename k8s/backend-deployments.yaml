      - name: config
        configMap:
          name: skirmbooks-invoicing-config
          items:
          - key: adapter-gestoria-invoicing.yaml
            path: adapter-gestoria-invoicing.yaml
      # Volumen PROYECTADO: el credential mount tiene que ser UN solo directorio
      # plano (providers/credentials.py lee ficheros sueltos ahí), pero las
      # credenciales de proveedor viven en su propio Secret para no repartirlas
      # con el bulk de skirmbooks-backend-secrets, que montan todos los backends.
      # `projected` fusiona ambos en /etc/synapse/credentials sin duplicar nada.
      - name: credentials
        projected:
          defaultMode: 292
          sources:
            - secret:
                name: skirmbooks-backend-secrets
            - secret:
                name: skirmbooks-provider-credentials
                # El framework arranca aunque no haya ninguna cuenta sembrada:
                # la lectura de credenciales es best-effort y la factory
                # devuelve None. Opcional para no acoplar el arranque a Vault.
                optional: true
      - name: synapse-data
        emptyDir: {}
