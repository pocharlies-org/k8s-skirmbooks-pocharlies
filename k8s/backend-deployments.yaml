apiVersion: apps/v1
kind: Deployment
metadata:
  name: skirmbooks-accounting
  namespace: skirmshop
  labels:
    app: skirmbooks-accounting
    app.kubernetes.io/name: skirmbooks-accounting
    app.kubernetes.io/part-of: synapse
    synapse.io/adapter: accounting
    synapse.io/worker-profile: legacy-drain
    e-dani.com/portfolio: skirmshop
    e-dani.com/component: skirmbooks-backend
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skirmbooks-accounting
  template:
    metadata:
      labels:
        app: skirmbooks-accounting
        app.kubernetes.io/name: skirmbooks-accounting
    spec:
      enableServiceLinks: false
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
      - key: role
        operator: Equal
        value: edge
        effect: NoSchedule
      imagePullSecrets:
      - name: harbor-pull
      containers:
      - name: accounting
        image: harbor.e-dani.com/homelab/skirmbooks-backend:multiempresa-20260610-1-delta@sha256:25f54d1ba76a411732fa3aa11445846ad8ad035bae86bcdf81ad5debcb1e2106
        args:
        - synapse_adapter_accounting
        env:
        - name: SYNAPSE_ADAPTER_GESTORIA_ACCOUNTING_CONFIG
          value: /etc/synapse/adapter-gestoria-accounting.yaml
        - name: SYNAPSE_LEGACY_DRAIN_QUEUE
          value: "1"
        ports:
        - name: metrics
          containerPort: 9524
        volumeMounts:
        - name: config
          mountPath: /etc/synapse/adapter-gestoria-accounting.yaml
          subPath: adapter-gestoria-accounting.yaml
          readOnly: true
        - name: credentials
          mountPath: /etc/synapse/credentials
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 768Mi
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - grep -q synapse_adapter /proc/1/cmdline
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: skirmbooks-accounting-config
          items:
          - key: adapter-gestoria-accounting.yaml
            path: adapter-gestoria-accounting.yaml
      - name: credentials
        secret:
          secretName: skirmbooks-backend-secrets
          defaultMode: 292
---
