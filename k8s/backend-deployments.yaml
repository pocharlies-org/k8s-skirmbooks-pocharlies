apiVersion: apps/v1
kind: Deployment
metadata:
  name: skirmbooks-accounting
  namespace: skirmshop
  labels:
    app: skirmbooks-accounting
    e-dani.com/portfolio: skirmshop
    e-dani.com/component: skirmbooks-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skirmbooks-accounting
  template:
    metadata:
      labels:
        app: skirmbooks-accounting
    spec:
      enableServiceLinks: false
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
      - key: role
        operator: Equal
        value: edge
        effect: NoSchedule
      imagePullSecrets:
      - name: harbor-pull
      containers:
      - name: accounting
        image: harbor.e-dani.com/homelab/skirmbooks-backend:s3-20260608-2@sha256:6d4313dfcb0e60618fb0a92a81633ec6533839967b794b0d1793cc05afd1a466
        args:
        - synapse_adapter_accounting
        env:
        - name: SYNAPSE_ADAPTER_GESTORIA_ACCOUNTING_CONFIG
          value: /etc/synapse/adapter-gestoria-accounting.yaml
        ports:
        - name: metrics
          containerPort: 9524
        volumeMounts:
        - name: config
          mountPath: /etc/synapse/adapter-gestoria-accounting.yaml
          subPath: adapter-gestoria-accounting.yaml
          readOnly: true
        - name: credentials
          mountPath: /etc/synapse/credentials
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 768Mi
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - grep -q synapse_adapter /proc/1/cmdline
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: skirmbooks-accounting-config
          items:
          - key: adapter-gestoria-accounting.yaml
            path: adapter-gestoria-accounting.yaml
      - name: credentials
        secret:
          secretName: skirmbooks-backend-secrets
          defaultMode: 292
---
