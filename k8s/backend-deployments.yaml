
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skirmbooks-accounting-entry
  namespace: skirmshop
  labels:
    app: skirmbooks-accounting-entry
    app.kubernetes.io/name: skirmbooks-accounting-entry
    app.kubernetes.io/part-of: synapse
    synapse.io/adapter: accounting
    synapse.io/worker-profile: entry
    e-dani.com/portfolio: skirmshop
    e-dani.com/component: skirmbooks-backend
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skirmbooks-accounting-entry
  template:
    metadata:
      labels:
        app: skirmbooks-accounting-entry
        app.kubernetes.io/name: skirmbooks-accounting-entry
        app.kubernetes.io/part-of: skirmbooks
    spec:
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
              - key: topology
                operator: NotIn
                values:
                - lan
      topologySpreadConstraints:
      - maxSkew: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: skirmbooks
      tolerations:
      - key: role
        operator: Equal
        value: edge
        effect: NoSchedule
      imagePullSecrets:
      - name: harbor-pull
      containers:
      - name: accounting
        image: harbor.e-dani.com/homelab/skirmbooks-backend:audit-ocr-20260807@sha256:c436639838756053099a72b27d7a90c02421787aa9782fac6321a2823e4fc42a
        args:
        - synapse_adapter_accounting
        env:
        - name: SYNAPSE_ADAPTER_GESTORIA_ACCOUNTING_CONFIG
          value: /etc/synapse/adapter-gestoria-accounting.yaml
        - name: SYNAPSE_COMMAND_ACTIONS
          value: entry.post,entry.amend,entry.reverse
        ports:
        - name: metrics
          containerPort: 9524
        volumeMounts:
        - name: config
          mountPath: /etc/synapse/adapter-gestoria-accounting.yaml
          subPath: adapter-gestoria-accounting.yaml
          readOnly: true
        - name: credentials
          mountPath: /etc/synapse/credentials
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 768Mi
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - grep -q synapse_adapter /proc/1/cmdline
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: config
        configMap:
          name: skirmbooks-accounting-config
          items:
          - key: adapter-gestoria-accounting.yaml
            path: adapter-gestoria-accounting.yaml
      - name: credentials
        secret:
          secretName: skirmbooks-backend-secrets
          defaultMode: 292
