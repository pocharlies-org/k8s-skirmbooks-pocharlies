# Skirmbooks backend secrets — pulled in bulk from Vault path
# `secret/skirmshop/skirmbooks`. Every key under that path becomes a key in the
# k8s Secret `skirmbooks-backend-secrets`, mountable as a credential file
# (synapse_shared.read_credential reads `$CREDENTIALS_DIRECTORY/<name>` or
# `/etc/synapse/credentials/<name>` — we mount this Secret at the latter).
#
# Required keys in Vault `secret/skirmshop/skirmbooks` (one per adapter
# unless noted):
#
#   PG role passwords (11):
#     gestoria_accounting_app.password
#     gestoria_banking_app.password
#     gestoria_fiscal_validator_app.password
#     gestoria_identity_app.password
#     gestoria_invoicing_app.password
#     gestoria_notifications_app.password
#     gestoria_payroll_app.password
#     gestoria_reporting_app.password
#     gestoria_shopify_sii_bridge_app.password
#     gestoria_sii_inbound_app.password
#     gestoria_tax_app.password
#
#   RMQ user passwords on the sauvage fabric broker (11):
#     synapse_adapter_gestoria_accounting.rmq.password
#     synapse_adapter_gestoria_banking.rmq.password
#     synapse_adapter_gestoria_fiscal_validator.rmq.password
#     synapse_adapter_gestoria_identity.rmq.password
#     synapse_adapter_gestoria_invoicing.rmq.password
#     synapse_adapter_gestoria_notifications.rmq.password
#     synapse_adapter_gestoria_payroll.rmq.password
#     synapse_adapter_gestoria_reporting.rmq.password
#     synapse_adapter_gestoria_shopify_sii_bridge.rmq.password
#     synapse_adapter_gestoria_sii_inbound.rmq.password
#     synapse_adapter_gestoria_tax.rmq.password
#
#   Banking integrations:
#     enable_banking.application_id
#     enable_banking.private_key      (PEM, multi-line)
#     tink.secret_id
#     tink.secret_key
#     stripe.api_key
#     stripe.webhook_secret
#     paypal.client_id
#     paypal.client_secret
#     paypal.webhook_id
#
#   LLM / brain / tokens:
#     litellm.api_key
#     shopify_sii_app.api_token
#
#   Crypto / app keys:
#     gestoria_identity.nif_vault_key        (32 bytes hex)
#     tax_calendar_ics.signing_key           (32 bytes hex)
#
# Until every required key is present in Vault the ExternalSecret will report
# `SecretSyncedError`; that's harmless — once populated it auto-syncs.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmbooks-backend-secrets
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: skirmbooks-backend-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: secret/skirmshop/skirmbooks
