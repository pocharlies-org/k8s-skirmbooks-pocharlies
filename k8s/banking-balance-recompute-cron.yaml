# Puebla bank_movements.balance_after (columna SALDO) y ordena created_at desde el
# bank_movement_ref de CaixaBank (formato N43 base64: '<secuencia> <saldo_en_centimos>').
# import_psd2 NO rellena balance_after; pero el SALDO REAL por linea lo da el banco
# codificado en la referencia -> se DECODIFICA (no se reconstruye). created_at se ajusta
# por la secuencia real del banco para que la UI (ORDER BY value_date DESC, created_at DESC)
# muestre el orden correcto (los movimientos de un lote comparten un created_at identico
# sin significado; value_date es la fecha real que se muestra).
# Puro data-job SQL (imagen backend, NO el adaptador multiempresa). 06:50 tras daily-sync.
# RLS FORCE: set_config('app.tenant_id') por tenant. Idempotente (guards IS DISTINCT FROM).
apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-banking-balance-recompute-script
  namespace: skirmshop
data:
  balance_recompute.py: |
    """Decodifica balance_after + ordena created_at desde bank_movement_ref (CaixaBank N43),
    por tenant (RLS FORCE). Idempotente."""
    import asyncio, yaml, asyncpg

    CFG = "/etc/synapse/adapter-gestoria-banking.yaml"
    CREDS = "/etc/synapse/credentials"

    # Decode defensivo del ref con padding base64 -> texto
    # '<seq(12)>   <saldo_centimos_con_signo>'. No todas las referencias PSD2
    # pertenecen a CaixaBank N43: filtrar el alfabeto y la longitud ANTES de
    # llamar a decode evita que una referencia opaca (por ejemplo con ':')
    # aborte el lote completo. encode(..., 'escape') evita además excepciones
    # de UTF-8 sobre bytea válidos que no sean texto N43; _OK los descartará.
    _REF = "regexp_replace(m.bank_movement_ref, '=+$', '')"
    _DEC = ("CASE WHEN " + _REF + " ~ '^[A-Za-z0-9+/]+$' AND "
            "length(" + _REF + ") % 4 <> 1 THEN encode(decode(" + _REF + " || "
            "repeat('=', (4 - length(" + _REF + ") % 4) % 4), 'base64'),'escape') END")
    _BAL = "(regexp_replace(" + _DEC + r", '^.*?(-?[0-9]+)[^0-9]*$', '\1'))::numeric/100"
    _SEQ = "(regexp_replace(" + _DEC + r", '^\s*([0-9]+).*$', '\1'))::bigint"
    _OK  = ("m.bank_movement_ref IS NOT NULL AND " + _DEC + " ~ '^[0-9]{8,}' AND "
            + _DEC + r" ~ '[0-9][[:space:]]*$'")

    # 1) balance_after = saldo real del banco (decodificado, por fila)
    SQL_BALANCE = (
        "UPDATE gestoria_banking.bank_movements m SET balance_after = " + _BAL +
        ", updated_at = now() WHERE " + _OK +
        " AND m.balance_after IS DISTINCT FROM " + _BAL)

    # 2) created_at = value_date + rank(por secuencia banco) seg -> orden correcto en la UI
    SQL_ORDER = (
        "WITH r AS (SELECT m.id, m.value_date, row_number() OVER "
        "(PARTITION BY m.account_id, m.value_date ORDER BY " + _SEQ + " ASC) AS rk "
        "FROM gestoria_banking.bank_movements m WHERE " + _OK + ") "
        "UPDATE gestoria_banking.bank_movements m "
        "SET created_at = r.value_date::timestamptz + (r.rk * interval '1 second') "
        "FROM r WHERE m.id = r.id "
        "AND m.created_at IS DISTINCT FROM r.value_date::timestamptz + (r.rk * interval '1 second')")

    def _read(p):
        with open(p) as f: return f.read().strip()

    def _inject_pw(url, pw):
        scheme, rest = url.split("://", 1)
        userhost, tail = rest.split("@", 1) if "@" in rest else (rest, "")
        return f"{scheme}://{userhost}:{pw}@{tail}" if tail else f"{scheme}://{userhost}:{pw}@"

    async def main():
        cfg = yaml.safe_load(open(CFG))
        dsn = _inject_pw(cfg["database"]["dsn"], _read(f"{CREDS}/gestoria_banking_app.password"))
        tenants = set(cfg.get("tenants") or [])
        conn = await asyncpg.connect(dsn)
        try:
            for r in await conn.fetch("SELECT tenant_id FROM gestoria_identity.tenants"):
                tenants.add(r["tenant_id"])
        except Exception as e:
            print(f"[balance-recompute] tenant discovery skipped: {e}", flush=True)
        if not tenants:
            tenants = {"skirmshop"}
        total_bal = total_ord = 0
        for t in sorted(tenants):
            async with conn.transaction():
                await conn.execute("SELECT set_config('app.tenant_id',$1,false)", t)
                rb = await conn.execute(SQL_BALANCE)
                ro = await conn.execute(SQL_ORDER)
                nb = int(rb.split()[-1]) if rb.startswith("UPDATE") else 0
                no = int(ro.split()[-1]) if ro.startswith("UPDATE") else 0
                total_bal += nb; total_ord += no
                print(f"[balance-recompute] tenant={t} balance={nb} order={no}", flush=True)
        await conn.close()
        print(f"[balance-recompute] tenants={sorted(tenants)} balance={total_bal} order={total_ord}", flush=True)

    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: skirmbooks-banking-balance-recompute
  namespace: skirmshop
  labels:
    app: skirmbooks-banking-balance-recompute
    app.kubernetes.io/part-of: skirmbooks
spec:
  schedule: "50 6 * * *"          # 06:50 UTC, tras daily-sync (06:40)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: skirmbooks-banking-balance-recompute
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          imagePullSecrets:
          - name: harbor-pull
          tolerations:
          - key: role
            operator: Equal
            value: edge
            effect: NoSchedule
          containers:
          - name: balance-recompute
            image: harbor.e-dani.com/homelab/skirmbooks-backend:psd2-always-on-20260630-delta@sha256:96e1bf6aa550d9b447e2e94492354b6f975cd9b1c85b569e4ddae24694164311
            command: ["python", "/scripts/balance_recompute.py"]
            resources:
              requests: { cpu: "25m", memory: "96Mi" }
              limits: { cpu: "250m", memory: "256Mi" }
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: config
              mountPath: /etc/synapse/adapter-gestoria-banking.yaml
              subPath: adapter-gestoria-banking.yaml
            - name: credentials
              mountPath: /etc/synapse/credentials
          volumes:
          - name: script
            configMap:
              name: skirmbooks-banking-balance-recompute-script
          - name: config
            configMap:
              name: skirmbooks-banking-config
          - name: credentials
            secret:
              secretName: skirmbooks-backend-secrets
