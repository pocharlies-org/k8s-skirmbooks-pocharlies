# Bucle automático de conciliación de FACTURAS de proveedor (skirmbooks).
#
# Para no acumular el trabajo a fin de mes. Dos CronJobs command-driven (mismo
# patrón que accounting-sweep-cron / reconcile-sweep-cron): publican comandos al
# exchange 'commands' del broker synapse-rmq (donde consumen email_search.start,
# messaging.send y reconcile.match_movement — todos el mismo broker).
#
#   facturas-daily  (10:00 UTC, tras los matchers de la mañana):
#     - RESOLVE seguimientos vivos (conciliado→resolved; factura hallada→match;
#       sin factura→pending; búsqueda colgada→reaper)
#     - DETECT cargos NUEVOS sin conciliar → búsqueda autónoma en buzón + anuncio
#       en el topic Telegram 'Facturas' (cap anti-spam)
#     - DRAIN del backlog 'pending' sin buscar aún (silencioso), hasta el cap
#     - first-run: backfill silencioso del backlog como 'pending'
#   facturas-weekly (lunes 11:00 UTC): resumen conciliadas vs pendientes + recordatorio
#
# SKIRM-188: facturas-daily y facturas-weekly (los que estaban fijados a
# skirmshop) itera las empresas ACTIVAS descubiertas en
# gestoria_identity.tenants — el wrapper run-per-tenant lanza el módulo con
# FACTURAS_TENANT=<empresa> para cada una (mismo contrato, sin módulo nuevo).
# moreno tiene su propio CronJob abajo (caps y silencio distintos) y se
# excluye con FACTURAS_TENANTS_EXCLUDE para no duplicarlo.
#
# Lógica testeada en synapse_adapter_banking.facturas_followup (imagen backend).
# DRY_RUN gobernado por env FACTURAS_DRY_RUN (default 0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-facturas-per-tenant-script
  namespace: skirmshop
data:
  run-per-tenant.py: |
    """Ejecuta el modulo de facturas por cada empresa activa (SKIRM-188)."""
    import asyncio, os, subprocess, sys
    import yaml, asyncpg

    CFG = "/etc/synapse/adapter-gestoria-invoicing.yaml"
    CREDS = "/etc/synapse/credentials"

    def _read(path):
        with open(path) as f:
            return f.read().strip()

    def _inject_pw(url, pw):
        scheme, rest = url.split("://", 1)
        userhost, tail = rest.split("@", 1) if "@" in rest else (rest, "")
        return f"{scheme}://{userhost}:{pw}@{tail}" if tail else f"{scheme}://{userhost}:{pw}@"

    async def discover():
        # Empresas ACTIVAS, elevado con SET LOCAL app.is_platform_admin dentro
        # de una transaccion (la RLS de 0045 da 0 filas sin elevacion, medido
        # en prod 17-10), como discover_tenants del fork. Fail-open: si la
        # lectura falla, manda el listado `tenants:` del config de invoicing.
        cfg = yaml.safe_load(open(CFG))
        tenants = set(cfg.get("tenants") or [])
        dsn = _inject_pw(cfg["database"]["dsn"], _read(f"{CREDS}/gestoria_invoicing_app.password"))
        try:
            conn = await asyncpg.connect(dsn, timeout=10)
            try:
                async with conn.transaction():
                    await conn.execute(
                        "SELECT set_config('app.is_platform_admin', 'on', true)"
                    )
                    for r in await conn.fetch(
                        "SELECT tenant_id FROM gestoria_identity.tenants WHERE status='active'"
                    ):
                        tenants.add(r["tenant_id"])
            finally:
                await conn.close()
        except Exception as e:
            print(f"[facturas-per-tenant] discovery skipped: {e}", flush=True)
        return tenants or {"skirmshop"}

    async def main():
        module = sys.argv[1]
        exclude = {t.strip() for t in os.environ.get("FACTURAS_TENANTS_EXCLUDE", "").split(",") if t.strip()}
        tenants = sorted(t for t in await discover() if t not in exclude)
        print(f"[facturas-per-tenant] modulo={module} tenants={tenants}", flush=True)
        rc = 0
        for t in tenants:
            r = subprocess.run([sys.executable, "-m", module],
                               env={**os.environ, "FACTURAS_TENANT": t})
            rc = rc or r.returncode
        sys.exit(rc)

    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: skirmbooks-facturas-daily
  namespace: skirmshop
  labels:
    app: skirmbooks-facturas-daily
    app.kubernetes.io/part-of: skirmbooks
spec:
  schedule: "0 10 * * *"          # 10:00 UTC, tras imports (06:00) y matchers (≤09:15)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # SKIRM-188: 600→1800 — el wrapper corre el modulo por empresa en secuencia
      # (los barridos son idempotentes: si el deadline corta, al dia siguiente se reanuda).
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: skirmbooks-facturas-daily
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          imagePullSecrets:
          - name: harbor-pull
          tolerations:
          - key: role
            operator: Equal
            value: edge
            effect: NoSchedule
          containers:
          - name: facturas-daily
            # 2026-07-10: bump 0627→0630 (commit 81992c4) — el 0627 no tiene has_booking→RESOLVE
            # ni la exclusión journal_lines en PENDING_GASTOS_SQL, por lo que los gastos ya
            # asentados (gasto sin factura) nunca se auto-resolvían y seguían en el digest diario.
            # Imagen ya en prod (skirmbooks-accounting-derived).
            image: harbor.e-dani.com/homelab/skirmbooks-backend:empresas-20261017@sha256:78d35e8d8b10f8f75fbb7f3b6198971620332ba54bae72f766610bece532431e
            command: ["python", "/scripts/run-per-tenant.py", "synapse_adapter_banking.facturas_daily"]
            env:
            - name: FACTURAS_TENANTS_EXCLUDE   # moreno tiene su propio CronJob abajo
              value: moreno
            - name: FACTURAS_SEARCH_CAP
              value: "12"
            - name: FACTURAS_ANNOUNCE_CAP
              value: "8"
            - name: FACTURAS_REAP_HOURS
              value: "24"
            - name: FACTURAS_DRY_RUN
              value: "0"
            resources:
              requests: { cpu: "25m", memory: "96Mi" }
              limits: { cpu: "250m", memory: "256Mi" }
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: config
              mountPath: /etc/synapse/adapter-gestoria-invoicing.yaml
              subPath: adapter-gestoria-invoicing.yaml
            - name: credentials
              mountPath: /etc/synapse/credentials
          volumes:
          - name: script
            configMap:
              name: skirmbooks-facturas-per-tenant-script
          - name: config
            configMap:
              name: skirmbooks-invoicing-config
          - name: credentials
            secret:
              secretName: skirmbooks-backend-secrets
---
