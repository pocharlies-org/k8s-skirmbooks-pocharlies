# skirmbooks-ui-secrets ← 1Password  (ESO-managed, replaces the manual Opaque secret)
# =============================================================================
# PURPOSE
#   Materialises the k8s Secret `skirmshop/skirmbooks-ui-secrets` from the
#   1Password item `skirmshop-skirmbooks-ui` (vault `k8s-pocharlies`; SC-496:
#   item field = former Vault property).
#   The skirmbooks-ui Deployment consumes this Secret via `envFrom.secretRef`
#   (manifest.yaml). It holds SESSION_SECRET — the HMAC root of EVERY session +
#   the signed `sb_tenant` cookie. With AUTH_ENABLED=true the pod is fail-closed:
#   if SESSION_SECRET is missing/empty the UI will NOT start (C3). Therefore this
#   ExternalSecret MUST publish all 5 keys, never a subset.
#
# ADOPTION OF THE MANUAL SECRET (project_vault_break_glass_eso)
#   creationPolicy: Owner  → ESO takes ownership of the existing Secret of the
#   same name (sets ownerReference=ExternalSecret + the managed label/annotation).
#   It does NOT delete-and-recreate; it patches in place. The existing
#   `kubectl.kubernetes.io/last-applied-configuration` annotation is harmless and
#   will be reconciled away on the next ESO write.
#
#   *** ZERO-DROP REQUIREMENT ***
#   We use dataFrom.extract (pull EVERY field of the item), identical to the
#   working `skirmbooks-backend-secrets`. This guarantees: whatever set of fields
#   exists in the item is published verbatim. The PMO MUST verify (before this
#   object reconciles against the live secret) that the 1Password item
#   `skirmshop-skirmbooks-ui` already contains exactly the 5 keys with identical
#   values — otherwise ESO could publish a smaller set and the UI would lose keys
#   / fail to boot. Apply order is enforced in
#   docs/p1-vault-eso/ui-secrets-vault-runbook.md.
#
#   SEED METHOD (do this FIRST): docs/p1-vault-eso/seed-ui-secrets-to-1password.sh
#   with a signed-in `op` session. NOTE (Vault era, proven 2026-06-21): an ESO
#   PushSecret to the old Vault path did NOT work — the ESO Vault role had no
#   write on secret/skirmshop/* (403). The same property holds for 1Password:
#   ESO only reads; seeding is the op CLI, not GitOps.
#
# deletionPolicy: Retain → deleting this ExternalSecret leaves the Secret intact
#   (no UI outage on accidental delete).
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmbooks-ui-secrets
  namespace: skirmshop
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: skirmbooks-ui-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    # template.mergePolicy defaults to Replace; with dataFrom.extract this means
    # the Secret data == the full key set found in the 1Password item. That is
    # exactly what we want: an authoritative mirror of `skirmshop-skirmbooks-ui`.
  dataFrom:
    - extract:
        key: skirmshop-skirmbooks-ui
