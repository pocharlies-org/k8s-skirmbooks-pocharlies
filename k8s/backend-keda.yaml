  namespace: skirmshop
  labels:
    app.kubernetes.io/part-of: synapse
    synapse.io/adapter: sii
    synapse.io/worker-profile: push
spec:
  scaleTargetRef:
    name: skirmbooks-sii-inbound-push
  pollingInterval: 30
  cooldownPeriod: 21600
  minReplicaCount: 1
  maxReplicaCount: 6
  triggers:
  - type: rabbitmq
    metadata:
      protocol: http
      mode: QueueLength
      value: '1'
      queueName: ^adapter\.sii\.push_recibida$
      useRegex: "true"
      operation: sum
    authenticationRef:
      name: skirmbooks-rabbitmq-http
---
