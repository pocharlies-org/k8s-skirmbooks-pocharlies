# Credenciales de los PROVEEDORES de facturas (framework Invoice Providers).
#
# Deliberadamente en su PROPIO path de Vault y su PROPIO Secret, y NO añadidas a
# `secret/skirmshop/skirmbooks`. Ese otro ExternalSecret hace `dataFrom.extract`,
# o sea que vuelca TODAS las claves del path a un único Secret que montan todos
# los backends de skirmbooks — incluido el pod del navegador AEAT. Meter ahí unas
# credenciales de facturación de terceros las repartiría a decenas de workloads
# que no las necesitan. Aquí solo las monta quien ejecuta los handlers de
# providers, vía volumen `projected` (ver backend-deployments.yaml).
#
# FORMA DE LAS CLAVES — la fija el código, no es libre. `providers/credentials.py`
# lee ficheros `{credentials_ref}.{cred_key}` bajo el credential mount, donde
# `credentials_ref` viene SIEMPRE de la fila de `invoice_provider_accounts`
# (invariante H4c: jamás se reconstruye desde el mensaje) y `cred_keys` las
# declara el ProviderSpec del registry. Para OVH:
#
#   providers.ovh.<account_key>.application_key
#   providers.ovh.<account_key>.application_secret
#   providers.ovh.<account_key>.consumer_key
#
# y para Amazon Business:
#
#   providers.amazon.<account_key>.client_id
#   providers.amazon.<account_key>.client_secret
#   providers.amazon.<account_key>.refresh_token
#
# Contraseñas de adjuntos cifrados recibidos por correo:
#
#   invoices.ups.password
#
# El `account_key` es el de la fila, así que las dos cuentas OVH ya provisionadas
# quedarían como `providers.ovh.claude-eu.*` y `providers.ovh.ca.*`.
#
# La lectura es BEST-EFFORT: una cuenta sin sembrar NO tumba el adapter — la
# factory devuelve None y el handler falla explícito. Por eso este Secret puede
# existir vacío y poblarse cuenta a cuenta.
#
# ─────────────────────────────────────────────────────────────────────────────
# PENDIENTE ANTES DE SEMBRAR — no es un detalle de despliegue, es de seguridad:
#
# Las consumer keys OVH provisionadas hoy en `infra-secrets` (ovh-claude-eu,
# ovh-ca) son FULL-ACCESS: comprobado en vivo con GET /auth/currentCredential,
# ambas tienen rules = [GET *, PUT *, PATCH *, POST *, DELETE *], sin allowedIPs
# y sin expiración, sobre la cuenta real de Skirmshop Spain S.L. (3 servidores
# dedicados y los medios de pago). El cliente de este framework SOLO emite GET
# (ovh_client.py: /me/bill y /me/bill/{id}), y su propio docstring las documenta
# como read-only.
#
# Sembrar esas claves aquí le daría a un pod comprometido control total de la
# cuenta OVH, incluido `POST /me/api/credential` para crear una key nueva que
# sobrevive a cualquier rotación en Vault. Antes de poblar este Secret hay que
# crear una consumer key restringida a `GET /me/bill*` con allowedIPs y
# expiración, y luego revocar las viejas — ojo, `ovh-ca` parece usarla también el
# backup a OVH VSPC, así que hay que migrar antes de revocar.
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmbooks-provider-credentials
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: skirmbooks-provider-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: secret/skirmshop/skirmbooks-providers
