# Disparador durable del IMPORT de los libros de la gestoría registrados en el SII
# de AEAT → gestoria_audit.gestoria_received_ledger (recibidas) y
# gestoria_audit.gestoria_issued_ledger (emitidas).
#
# Contexto: skirmbooks es command-driven (sin engine de workflows desplegado).
# Los handlers `sii.import_recibidas` / `sii.import_emitidas` consultan
# ConsultaLRFacturasRecibidas / ConsultaLRFacturasEmitidas contra AEAT PRODUCCIÓN
# con el cert de la sociedad (mTLS) y hacen UPSERT idempotente del libro REMOTO
# real (lo que la gestoría ya presentó). Es la baseline de la auditoría
# comparativa "libro gestoría vs skirmbooks vs banco". Sin las emitidas el IVA
# REPERCUTIDO del 303 no se puede contrastar contra Hacienda.
#
# Este CronJob publica mensualmente, al broker synapse-rmq (exchange `commands`),
# los comandos del MES ANTERIOR para cada tenant:
#   routing_key = sii.<tenant>.<accion>   con accion en SII_IMPORT_ACTIONS
#   plugin      = sii.<accion>
#   params      = {fiscal_year, period_month}
# Lo consume el deployment skirmbooks-sii-inbound-reconcile
# (SYNAPSE_COMMAND_ACTIONS incluye ambos imports + cert sii-certificate montado).
# Su ScaledObject de KEDA vigila las tres colas: con minReplicaCount 0, si el
# scaler no mira la cola del import el mensaje se queda ahí sin consumidor.
#
# Idempotente por diseño: el UPSERT dedupea por (tenant, supplier_nif, nº, fecha)
# en recibidas y por (tenant, nº, fecha) en emitidas (en emitidas el emisor somos
# siempre nosotros, y una factura a consumidor final no lleva NIF de cliente), así
# que re-ejecutar el mismo mes solo refresca filas. Reusa la imagen + config +
# credenciales del adapter sii-inbound (aditivo, no toca los Deployments vivos).
apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-sii-import-recibidas-script
  namespace: skirmshop
data:
  publish.py: |
    """Publica sii.<tenant>.<accion> {fiscal_year, period_month} del mes anterior."""
    import asyncio, json, os, uuid, datetime
    import yaml, asyncpg, aio_pika

    CFG = "/etc/synapse/adapter-gestoria-sii-inbound.yaml"
    CREDS = "/etc/synapse/credentials"
    # Override por env para un backfill selectivo (p.ej. solo emitidas).
    ACTIONS = [a.strip() for a in os.getenv(
        "SII_IMPORT_ACTIONS", "import_recibidas,import_emitidas").split(",") if a.strip()]

    def _read(path):
        with open(path) as f:
            return f.read().strip()

    def _inject_pw(url: str, pw: str) -> str:
        # amqp://user@host/... -> amqp://user:pw@host/...   (idem postgresql://)
        scheme, rest = url.split("://", 1)
        userhost, tail = rest.split("@", 1) if "@" in rest else (rest, "")
        return f"{scheme}://{userhost}:{pw}@{tail}" if tail else f"{scheme}://{userhost}:{pw}@"

    def _prev_month():
        # Permite override por env (backfill manual): SII_FISCAL_YEAR / SII_PERIOD_MONTH.
        y = os.getenv("SII_FISCAL_YEAR")
        m = os.getenv("SII_PERIOD_MONTH")
        if y and m:
            return int(y), int(m)
        today = datetime.date.today()
        first = today.replace(day=1)
        prev = first - datetime.timedelta(days=1)
        return prev.year, prev.month

    async def main():
        cfg = yaml.safe_load(open(CFG))
        db_pw = _read(f"{CREDS}/gestoria_sii_inbound_app.password")
        rmq_pw = _read(f"{CREDS}/synapse_adapter_gestoria_sii_inbound.rmq.password")
        dsn = _inject_pw(cfg["database"]["dsn"], db_pw)
        amqp_url = _inject_pw(cfg["rabbitmq"]["url"], rmq_pw)
        tenants = set(cfg.get("tenants") or [])

        # discovery best-effort (cubre empresas añadidas tras el config)
        conn = await asyncpg.connect(dsn)
        try:
            for r in await conn.fetch("SELECT tenant_id FROM gestoria_identity.tenants"):
                tenants.add(r["tenant_id"])
        except Exception as e:
            print(f"[sii-import] tenant discovery skipped: {e}", flush=True)
        finally:
            await conn.close()
        if not tenants:
            tenants = {"skirmshop"}

        fiscal_year, period_month = _prev_month()
        print(f"[sii-import] tenants={sorted(tenants)} acciones={ACTIONS} "
              f"fiscal_year={fiscal_year} period_month={period_month}", flush=True)

        rmq = await aio_pika.connect_robust(amqp_url)
        ch = await rmq.channel(publisher_confirms=True)
        ex = await ch.declare_exchange("commands", aio_pika.ExchangeType.TOPIC, durable=True)
        published = {}
        for t in sorted(tenants):
            for action in ACTIONS:
                msg_id = uuid.uuid4().hex
                body = json.dumps({
                    "workflow_instance_id": str(uuid.uuid4()),
                    "step_id": msg_id,
                    "plugin": f"sii.{action}",
                    "params": {"fiscal_year": fiscal_year, "period_month": period_month},
                    "attempt": 1,
                    "fire_and_forget": True,
                }).encode()
                await ex.publish(
                    aio_pika.Message(
                        body=body, content_type="application/json",
                        delivery_mode=aio_pika.DeliveryMode.PERSISTENT,
                        message_id=msg_id,
                        headers={"tenant_id": t, "source": "sii-import-cron", "fire_and_forget": "true"},
                    ),
                    routing_key=f"sii.{t}.{action}",
                )
                published[action] = published.get(action, 0) + 1
        await rmq.close()
        print(f"[sii-import] publicados {published}", flush=True)

    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: skirmbooks-sii-import-recibidas
  namespace: skirmshop
  labels:
    app: skirmbooks-sii-import-recibidas
    app.kubernetes.io/part-of: skirmbooks
spec:
  # Días 20 y 26 a las 04:00 UTC. Antes era el día 10, con el razonamiento de que
  # "el libro del mes anterior ya está presentado (plazo SII = 4 días hábiles)".
  # Ese razonamiento es el plazo LEGAL, no lo que hace la gestoría: presenta a
  # mediados de mes. Medido el 17-08-2026 contra AEAT: el libro de junio se
  # presentó el 15-07 16:17 y el segundo lote de mayo el 15-06 16:40. O sea que
  # el día 10 el libro AÚN NO EXISTE, la consulta devuelve `SinDatos` y el import
  # inserta cero.
  #
  # Y no falla: el Job sale `Complete` porque el publish y el handler hacen su
  # trabajo — `sii_import_recibidas_done aeat_count=0 inserted=0`. Con eso este
  # CronJob no importó NADA desde que se creó (26-06-2026): junio y julio 2026 se
  # quedaron fuera del ledger y solo aparecieron al lanzarlo a mano.
  #
  # Dos disparos porque uno solo vuelve a ser frágil si algún mes se presenta más
  # tarde. Es seguro repetir: el handler hace UPSERT e informa
  # `inserted/updated/skipped` (idempotencia verificada con junio 2026).
  schedule: "0 4 20,26 * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: skirmbooks-sii-import-recibidas
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          imagePullSecrets:
          - name: harbor-pull
          tolerations:
          - key: role
            operator: Equal
            value: edge
            effect: NoSchedule
          containers:
          - name: publish
            image: harbor.e-dani.com/homelab/skirmbooks-backend:audit-ocr-20260807@sha256:c436639838756053099a72b27d7a90c02421787aa9782fac6321a2823e4fc42a
            command: ["python", "/scripts/publish.py"]
            resources:
              requests: { cpu: "25m", memory: "96Mi" }
              limits: { cpu: "250m", memory: "256Mi" }
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: config
              mountPath: /etc/synapse/adapter-gestoria-sii-inbound.yaml
              subPath: adapter-gestoria-sii-inbound.yaml
            - name: credentials
              mountPath: /etc/synapse/credentials
          volumes:
          - name: script
            configMap:
              name: skirmbooks-sii-import-recibidas-script
          - name: config
            configMap:
              name: skirmbooks-sii-inbound-config
          - name: credentials
            secret:
              secretName: skirmbooks-backend-secrets
