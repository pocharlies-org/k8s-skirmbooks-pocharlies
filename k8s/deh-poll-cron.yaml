# Vigilancia DEHú: dos pasadas al día (05:15 y 15:15 UTC ≈ mañana y media
# tarde peninsular). El job publica UN comando notifications.skirmshop.deh_poll;
# todo lo demás (leer buzones, emparejar NIF, escalar severidades, marcar
# vencidas, publicar los dispatch) lo hace el adapter en deh_poll — el cron
# no toca la BD. Patrón = tax-modelo-sweep ("no engine para skirmbooks").
#
# La segunda pasada es la que pilla los vencimientos del mismo día: el escalado
# a critical a ≤1 día se dispara en cuanto quedan <24 h.
apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-deh-poll-script
  namespace: skirmshop
data:
  poll.py: |
    """Publica el comando deh_poll (una vez; el poll es idempotente)."""
    import asyncio, json, os, uuid
    import yaml, aio_pika

    CFG = "/etc/synapse/adapter-gestoria-notifications.yaml"
    CREDS = "/etc/synapse/credentials"

    def _read(path):
        with open(path) as f:
            return f.read().strip()

    def _inject_pw(url: str, pw: str) -> str:
        scheme, rest = url.split("://", 1)
        userhost, tail = rest.split("@", 1) if "@" in rest else (rest, "")
        return f"{scheme}://{userhost}:{pw}@{tail}" if tail else f"{scheme}://{userhost}:{pw}@"

    async def main():
        cfg = yaml.safe_load(open(CFG))
        if not (cfg.get("deh") or {}).get("enabled"):
            print("[deh-poll] deh.enabled=false — nada que hacer", flush=True)
            return
        rmq_pw = _read(f"{CREDS}/synapse_adapter_gestoria_notifications.rmq.password")
        amqp_url = _inject_pw(cfg["rabbitmq"]["url"], rmq_pw)

        rmq = await aio_pika.connect_robust(amqp_url)
        ch = await rmq.channel(publisher_confirms=True)
        ex = await ch.declare_exchange("commands", aio_pika.ExchangeType.TOPIC, durable=True)
        msg_id = uuid.uuid4().hex
        body = json.dumps({
            "workflow_instance_id": str(uuid.uuid4()),
            "step_id": msg_id,
            "plugin": "notifications.deh.poll",
            "params": {},
            "attempt": 1,
        }).encode()
        await ex.publish(
            aio_pika.Message(
                body=body, content_type="application/json",
                delivery_mode=aio_pika.DeliveryMode.PERSISTENT,
                message_id=msg_id,
                headers={"tenant_id": "skirmshop", "source": "deh-poll-cron"},
            ),
            routing_key="notifications.skirmshop.deh_poll",
        )
        await rmq.close()
        print(f"[deh-poll] comando publicado ({msg_id})", flush=True)

    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: skirmbooks-deh-poll-morning
  namespace: skirmshop
  labels:
    app: skirmbooks-deh-poll
    app.kubernetes.io/part-of: skirmbooks
    e-dani.com/portfolio: skirmshop
spec:
  schedule: "15 5 * * *"   # 07:15 peninsular
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: skirmbooks-deh-poll
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          imagePullSecrets:
          - name: harbor-pull
          tolerations:
          - key: role
            operator: Equal
            value: edge
            effect: NoSchedule
          containers:
          - name: poll
            image: harbor.e-dani.com/homelab/skirmbooks-backend:casillas-12-13-20260814@sha256:30e7ed63c3dbdfb79e5e99d4b6810ac7b958ba57244c8e28ef773d12bd2fe450
            command: ["python", "/scripts/poll.py"]
            resources:
              requests: { cpu: "25m", memory: "96Mi" }
              limits: { cpu: "250m", memory: "256Mi" }
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: config
              mountPath: /etc/synapse/adapter-gestoria-notifications.yaml
              subPath: adapter-gestoria-notifications.yaml
            - name: credentials
              mountPath: /etc/synapse/credentials
          volumes:
          - name: script
            configMap:
              name: skirmbooks-deh-poll-script
          - name: config
            configMap:
              name: skirmbooks-notifications-config
          - name: credentials
            secret:
              secretName: skirmbooks-backend-secrets
              defaultMode: 292
