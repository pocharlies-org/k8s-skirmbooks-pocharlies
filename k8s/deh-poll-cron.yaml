# Vigilancia DEHú: tres pasadas al día (05:15, 15:15 y 22:15 Europe/Madrid —
# temprano, mediodía y noche). El job publica UN comando
# notifications.<tenant>.deh.poll POR CADA EMPRESA ACTA (SKIRM-188: descubrimiento
# de gestoria_identity.tenants elevado con SET LOCAL app.is_platform_admin, mismo
# contrato de routing key, sin cola nueva); todo lo demás (leer buzones, emparejar NIF,
# escalar severidades, marcar vencidas, publicar los dispatch) lo hace el
# adapter en deh_poll — el cron no toca la BD. Patrón = tax-modelo-sweep
# ("no engine para skirmbooks").
#
# timeZone explícito: sin él los CronJobs corren en UTC y los avisos de
# cortesía de DEHú (noreply.dehu@correo.gob.es), que llegan por la tarde-noche
# (~18:50-19:15 CEST medido), no se detectaban hasta la pasada de la mañana
# siguiente — ventana ciega de ~12 h. La pasada de noche (22:15) cierra ese
# hueco. Repetir corridas es seguro: el UPSERT del poll es idempotente por
# (tenant, external_id) y el handler sólo lee el buzón y la BD propia.
#
# La pasada de las 15:15 es la que pilla los vencimientos del mismo día: el
# escalado a critical a ≤1 día se dispara en cuanto quedan <24 h.
apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-deh-poll-script
  namespace: skirmshop
data:
  poll.py: |
    """Publica notifications.<tenant>.deh.poll por cada empresa activa."""
    import asyncio, json, os, uuid
    import yaml, asyncpg, aio_pika

    CFG = "/etc/synapse/adapter-gestoria-notifications.yaml"
    CREDS = "/etc/synapse/credentials"

    def _read(path):
        with open(path) as f:
            return f.read().strip()

    def _inject_pw(url: str, pw: str) -> str:
        scheme, rest = url.split("://", 1)
        userhost, tail = rest.split("@", 1) if "@" in rest else (rest, "")
        return f"{scheme}://{userhost}:{pw}@{tail}" if tail else f"{scheme}://{userhost}:{pw}@"

    async def _discover(cfg):
        # SKIRM-188: empresas ACTIVAS de gestoria_identity.tenants, elevado con
        # SET LOCAL app.is_platform_admin en transaccion (la RLS de 0045 da 0
        # filas sin ello; verificado en prod 17-10 con este rol). La lectura es
        # solo para el listado: el cron NO toca la BD por lo demas. Fail-open:
        # si falla, manda el listado `tenants:` del config.
        tenants = set(cfg.get("tenants") or [])
        dsn = _inject_pw(cfg["database"]["dsn"], _read(f"{CREDS}/gestoria_notifications_app.password"))
        try:
            conn = await asyncpg.connect(dsn, timeout=10)
            try:
                async with conn.transaction():
                    await conn.execute(
                        "SELECT set_config('app.is_platform_admin', 'on', true)"
                    )
                    for r in await conn.fetch(
                        "SELECT tenant_id FROM gestoria_identity.tenants WHERE status='active' AND profile='empresa'"
                    ):
                        tenants.add(r["tenant_id"])
            finally:
                await conn.close()
        except Exception as e:
            print(f"[deh-poll] tenant discovery skipped: {e}", flush=True)
        return sorted(tenants) or ["skirmshop"]

    async def main():
        cfg = yaml.safe_load(open(CFG))
        if not (cfg.get("deh") or {}).get("enabled"):
            print("[deh-poll] deh.enabled=false — nada que hacer", flush=True)
            return
        rmq_pw = _read(f"{CREDS}/synapse_adapter_gestoria_notifications.rmq.password")
        amqp_url = _inject_pw(cfg["rabbitmq"]["url"], rmq_pw)
        tenants = await _discover(cfg)
        print(f"[deh-poll] tenants={tenants}", flush=True)

        rmq = await aio_pika.connect_robust(amqp_url)
        ch = await rmq.channel(publisher_confirms=True)
        ex = await ch.declare_exchange("commands", aio_pika.ExchangeType.TOPIC, durable=True)
        for t in tenants:
            msg_id = uuid.uuid4().hex
            body = json.dumps({
                "workflow_instance_id": str(uuid.uuid4()),
                "step_id": msg_id,
                "plugin": "notifications.deh.poll",
                "params": {},
                "attempt": 1,
            }).encode()
            await ex.publish(
                aio_pika.Message(
                    body=body, content_type="application/json",
                    delivery_mode=aio_pika.DeliveryMode.PERSISTENT,
                    message_id=msg_id,
                    headers={"tenant_id": t, "source": "deh-poll-cron"},
                ),
                routing_key=f"notifications.{t}.deh.poll",
            )
        await rmq.close()
        print(f"[deh-poll] comandos publicados para {len(tenants)} empresas", flush=True)

    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: skirmbooks-deh-poll-morning
  namespace: skirmshop
  labels:
    app: skirmbooks-deh-poll
    app.kubernetes.io/part-of: skirmbooks
    e-dani.com/portfolio: skirmshop
spec:
  schedule: "15 5 * * *"   # 05:15 peninsular
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: skirmbooks-deh-poll
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          imagePullSecrets:
          - name: harbor-pull
          tolerations:
          - key: role
            operator: Equal
            value: edge
            effect: NoSchedule
          containers:
          - name: poll
            image: harbor.e-dani.com/homelab/skirmbooks-backend:gestoria-20261018@sha256:6748a0d195d9679567faf7ed1b795a634b0642ab650f3c9e876432fc8f7704b0
            command: ["python", "/scripts/poll.py"]
            resources:
              requests: { cpu: "25m", memory: "96Mi" }
              limits: { cpu: "250m", memory: "256Mi" }
            volumeMounts:
            - name: script
              mountPath: /scripts
            - name: config
              mountPath: /etc/synapse/adapter-gestoria-notifications.yaml
              subPath: adapter-gestoria-notifications.yaml
            - name: credentials
              mountPath: /etc/synapse/credentials
          volumes:
          - name: script
            configMap:
              name: skirmbooks-deh-poll-script
          - name: config
            configMap:
              name: skirmbooks-notifications-config
          - name: credentials
            secret:
              secretName: skirmbooks-backend-secrets
              defaultMode: 292
---
