apiVersion: apps/v1
kind: Deployment
metadata:
  name: skirmbooks-ui
  namespace: skirmshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skirmbooks-ui
  template:
    metadata:
      labels:
        app: skirmbooks-ui
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        role: edge
        kubernetes.io/arch: amd64
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: skirmbooks-ui
          image: harbor.e-dani.com/homelab/skirmbooks-ui:multiempresa-20260612-8@sha256:c9bd55054fd05a6b0d44749e5daca8b5cd89c8c5b6dd6f5c8c78bf87c14d79a3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3050
              protocol: TCP
          env:
            # SSR must render dates in the users' TZ (Spain), not UTC, or React
            # hydration mismatches on every date (#418/#425) force a full client
            # re-render — the flash users saw as "la página no carga".
            - name: TZ
              value: Europe/Madrid
            # Validación 369: lectura de OssCountryDaily en la BD de la app
            # shopify-sii (misma instancia CNPG, database `skirmshop`). Mismo
            # patrón que el accounting-sweep. Fail-soft si falta.
            - name: SII_DB_USER
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: username
            - name: SII_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: password
            - name: SII_DATABASE_URL
              value: postgresql://$(SII_DB_USER):$(SII_DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3050"
            - name: HOST
              value: 0.0.0.0
            # Multi-empresa: tenant por defecto cuando el request no trae la
            # cookie sb_tenant (probes, webhooks, primer acceso). El GUC de RLS
            # lo fija la app por checkout (set_config), ya NO va en el DSN.
            - name: TENANT_ID
              value: skirmshop
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: password
            - name: GESTORIA_DB_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmbooks
            - name: _RMQUSER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: _RMQPASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: AMQP_HOST
              value: shared-rabbitmq.databases.svc.cluster.local
            - name: AMQP_PORT
              value: "5672"
            - name: AMQP_VHOST
              value: /synapse
            - name: AMQP_USER
              value: $(_RMQUSER)
            - name: AMQP_PASSWORD
              value: $(_RMQPASS)
            # Broker de los adapters skirmbooks (synapse-rmq = shared-rabbitmq de
            # sauvage). OJO: shared-rabbitmq.databases.svc es OTRO broker (k8s HA)
            # sin consumidores de estos comandos — drift histórico de la UI.
            - name: _SKBUI_RMQ_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: skirmbooks-ui-rmq
            - name: _SKBUI_RMQ_PASS
              valueFrom:
                secretKeyRef:
                  key: password
                  name: skirmbooks-ui-rmq
            - name: AMQP_URL
              value: amqp://$(_SKBUI_RMQ_USER):$(_SKBUI_RMQ_PASS)@synapse-rmq.databases.svc.cluster.local:5672/%2Fsynapse
            - name: S3_ENDPOINT
              value: http://skirmshop-drive-s3.backup-hub.svc.cluster.local:9000
            - name: S3_BUCKET
              value: skirmshop-drive
            - name: S3_REGION
              value: us-east-1
            - name: S3_PREFIX
              value: skirmbooks/invoicing
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: skirmshop-drive-s3-app
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: skirmshop-drive-s3-app
                  key: AWS_SECRET_ACCESS_KEY
            # OCR (facturas recibidas) → in-cluster LiteLLM. The sauvage-hosted pod
            # cannot reach the x86 LAN default (192.168.50.142); use the cluster svc.
            # LITELLM_API_KEY is injected via envFrom: skirmbooks-ui-secrets.
            - name: LITELLM_BASE
              value: http://litellm.litellm.svc.cluster.local:4000/v1
            - name: LITELLM_OCR_MODEL
              value: qwen36-35b
          envFrom:
            - secretRef:
                name: skirmbooks-ui-secrets
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3050
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3050
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: skirmbooks-ui
  namespace: skirmshop
spec:
  selector:
    app: skirmbooks-ui
  ports:
    - name: http
      port: 80
      targetPort: 3050
---
# LAN/Tailscale-only access (financial app, not internet-facing).
# Resolves via *.lan.e-dani.com → traefik-lan LB (192.168.50.240).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: skirmbooks-ui-lan
  namespace: skirmshop
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`skirmbooks.lan.e-dani.com`)
      services:
        - name: skirmbooks-ui
          port: 80
  tls:
    store:
      name: default
      namespace: traefik-lan
