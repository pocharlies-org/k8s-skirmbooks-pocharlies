apiVersion: apps/v1
kind: Deployment
metadata:
  name: skirmbooks-ui
  namespace: skirmshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skirmbooks-ui
  template:
    metadata:
      labels:
        app: skirmbooks-ui
        app.kubernetes.io/part-of: skirmbooks
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
              - key: topology
                operator: NotIn
                values:
                - lan
      topologySpreadConstraints:
      - maxSkew: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: skirmbooks
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: skirmbooks-ui
          image: harbor.lan.e-dani.com/homelab/skirmbooks-ui:audit-ocr-20260807@sha256:7d201a42ad271d321513ca0adc121360064154d973432f06391a623614c4aa0f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3050
              protocol: TCP
          env:
            # SSR must render dates in the users' TZ (Spain), not UTC, or React
            # hydration mismatches on every date (#418/#425) force a full client
            # re-render — the flash users saw as "la página no carga".
            - name: TZ
              value: Europe/Madrid
            # Validación 369: lectura de OssCountryDaily en la BD de la app
            # shopify-sii (misma instancia CNPG, database `skirmshop`). Mismo
            # patrón que el accounting-sweep. Fail-soft si falta.
            - name: SII_DB_USER
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: username
            - name: SII_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: password
            - name: SII_DATABASE_URL
              value: postgresql://$(SII_DB_USER):$(SII_DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3050"
            - name: HOST
              value: 0.0.0.0
            # Multi-empresa: tenant por defecto cuando el request no trae la
            # cookie sb_tenant (probes, webhooks, primer acceso). El GUC de RLS
            # lo fija la app por checkout (set_config), ya NO va en el DSN.
            - name: TENANT_ID
              value: skirmshop
            # Auth multi-empresa + nivel CUENTA. ACTIVADO 2026-06-21 con la imagen
            # accounts-tier-20260621 (de main ac2e007: /login + gate + RLS account-aware
            # + SESSION_SECRET fail-closed). Con "true" el gate exige sesión salvo allowlist
            # (login/logout, /assets, /webhooks, callbacks PSD2) y el aislamiento cross-cuenta
            # pasa a ser efectivo (cada usuario ve solo su cuenta; Dani=platform-admin ve todo).
            # REQUISITO ya cumplido: SESSION_SECRET (>=32) sembrado en skirmbooks-ui-secrets +
            # NODE_ENV=production (cookies Secure). Volver a "false" = legacy LAN sin login.
            - name: AUTH_ENABLED
              value: "true"
            # SSO-trust (login Google/Keycloak de una sola pasada) — DESPLEGADO con la
            # imagen psd2-sso-20260701-1844. Un request no autenticado que traiga el
            # id_token del oauth2-proxy (Authorization: Bearer) se valida contra el JWKS
            # de Keycloak (firma+issuer+exp) y mintea sesión, sin pedir contraseña. LAN y
            # login por contraseña intactos (fail-closed sin la env). FOLLOW-UP: fijar
            # SSO_OIDC_AUDIENCE (client_id del oauth2-proxy) tras ver un token real.
            - name: SSO_TRUST_ENABLED
              value: "true"
            - name: SSO_OIDC_ISSUER
              value: https://auth-next.e-dani.com/realms/edani
            - name: SSO_JWKS_URL
              value: http://keycloak.keycloak.svc.cluster.local/realms/edani/protocol/openid-connect/certs
            # Logout de verdad en el host SSO: cierra la sesión de la app + la SSO (sign_out del
            # oauth2-proxy encadenado al end_session de Keycloak) → cierra Google/Keycloak. En LAN
            # (sin Bearer) el logout va a /login (password). Sin post_logout_redirect_uri → aterriza
            # en la página "sesión cerrada" de Keycloak; para auto-volver a Skirmbooks hay que
            # whitelistear https://skirmbooks.e-dani.com/ en "Valid post logout redirect URIs" del
            # client oauth2-proxy (realm edani) y añadir &post_logout_redirect_uri=... aquí.
            - name: SSO_LOGOUT_URL
              value: "https://auth-next.e-dani.com/oauth2/sign_out?rd=https%3A%2F%2Fauth-next.e-dani.com%2Frealms%2Fedani%2Fprotocol%2Fopenid-connect%2Flogout%3Fpost_logout_redirect_uri%3Dhttps%253A%252F%252Fskirmbooks.e-dani.com%252F%26client_id%3Doauth2-proxy"
            # SESSION_SECRET (HMAC de la cookie sb_tenant firmada + sesión __sb_session)
            # se inyecta vía envFrom: skirmbooks-ui-secrets — sembrar la clave
            # SESSION_SECRET (32+ bytes aleatorios) en Vault/ESO ANTES de AUTH_ENABLED=true.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-app
                  key: password
            - name: GESTORIA_DB_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmbooks
            - name: _RMQUSER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: _RMQPASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_DEFAULT_PASS
            - name: AMQP_HOST
              value: shared-rabbitmq.databases.svc.cluster.local
            - name: AMQP_PORT
              value: "5672"
            - name: AMQP_VHOST
              value: /synapse
            - name: AMQP_USER
              value: $(_RMQUSER)
            - name: AMQP_PASSWORD
              value: $(_RMQPASS)
            # Broker de los adapters skirmbooks (synapse-rmq = shared-rabbitmq de
            # sauvage). OJO: shared-rabbitmq.databases.svc es OTRO broker (k8s HA)
            # sin consumidores de estos comandos — drift histórico de la UI.
            - name: _SKBUI_RMQ_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: skirmbooks-ui-rmq
            - name: _SKBUI_RMQ_PASS
              valueFrom:
                secretKeyRef:
                  key: password
                  name: skirmbooks-ui-rmq
            - name: AMQP_URL
              value: amqp://$(_SKBUI_RMQ_USER):$(_SKBUI_RMQ_PASS)@synapse-rmq.databases.svc.cluster.local:5672/%2Fsynapse
            - name: S3_ENDPOINT
              value: http://skirmshop-drive-s3.backup-hub.svc.cluster.local:9000
            - name: S3_BUCKET
              value: skirmshop-drive
            - name: S3_REGION
              value: us-east-1
            - name: S3_PREFIX
              value: skirmbooks/invoicing
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: skirmshop-drive-s3-app
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: skirmshop-drive-s3-app
                  key: AWS_SECRET_ACCESS_KEY
            # OCR (facturas recibidas) → in-cluster LiteLLM. The sauvage-hosted pod
            # cannot reach the x86 LAN default (192.168.50.142); use the cluster svc.
            # LITELLM_API_KEY is injected via envFrom: skirmbooks-ui-secrets.
            - name: LITELLM_BASE
              value: http://litellm.litellm.svc.cluster.local:4000/v1
            # `tooling` y no `qwen36-35b` (2026-08-10). Los dos apuntan HOY al mismo
            # sitio, pero `qwen36-35b` es un nombre de MODELO servido por quien sea el
            # residente de turno -- ahora DeepSeek-V4-Flash -- y esos nombres van a
            # quedar restringidos al backend Qwen real. `tooling` es el nombre de
            # CAPACIDAD: el residente, sea cual sea, con degradado a `dense`.
            #
            # Esto NO necesita modelo multimodal: pese al nombre, la llamada manda el
            # texto ya extraido del PDF (ocr.server.ts) y pide JSON con esquema
            # estricto. El OCR de verdad pasa antes.
            - name: LITELLM_OCR_MODEL
              value: tooling
          envFrom:
            - secretRef:
                name: skirmbooks-ui-secrets
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3050
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3050
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: skirmbooks-ui
  namespace: skirmshop
spec:
  selector:
    app: skirmbooks-ui
  ports:
    - name: http
      port: 80
      targetPort: 3050
# NOTA: el acceso LAN (IngressRoute skirmbooks-ui-lan, Host skirmbooks.lan.e-dani.com)
# se RETIRÓ 2026-07-11 (solo daba confusión: mostraba el form de contraseña sin el
# botón de Google, porque bypaseaba el oauth2-proxy). Acceso único = edge público
# https://skirmbooks.e-dani.com (SSO Keycloak/Google), definido en k8s-infra-pocharlies
# networking/traefik-edge/legacy-public-routes.yaml. Break-glass si el SSO cae:
# `kubectl -n skirmshop port-forward svc/skirmbooks-ui 3050:80` (form de contraseña de la app)
# o re-crear este IngressRoute temporalmente.
