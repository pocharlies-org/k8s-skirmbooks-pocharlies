# INFRA-213 (INFRA-210 C2) — Job del redriver de facturas `received` — PASADA REAL (intento 2).
#
# Corre `python -m synapse_adapter_invoicing.redrive_received` (llegó en el PR #28,
# imagen ingest-event-20261003) sobre la allowlist del spec: relee el PDF desde S3
# (InvoiceArtifactStore, bucket skirmshop-drive) y publica el evento que dispara la
# cadena OCR→classify. El módulo (adapters/invoicing/src/…/redrive_received.py):
#   * solo toca la allowlist explícita REDRIVE_INVOICE_IDS;
#   * REDRIVE_DRY_RUN "0" → publica. Intento anterior
#     (skirmbooks-redrive-received-real-20261003, imagen ingest-event-20261003)
#     FALLÓ: ch.flush() no existe en RobustChannel — arreglado en #41 (113a47b),
#     imagen ingest-event-20261003-2. El dry-run ya cuadra con lo esperado
#     (redrained(dry) ×2 —9d32d0e3, 9e877220— y skipped ×3, nota-sre-fase1-prep.md §4).
#     Esperado con el fix (el dry-run no publicó nada; 9d32d0e3 sigue received):
#     1 redrained (9e877220) + 4 skipped (9d32d0e3 y e203aaaf ya classified;
#     75b31380 y 9bb58ac7 sin fila), 0 irrecuperable.
#   * TENANT por FACTURAS_TENANT (set_config app.tenant_id, RLS).
#
# Reutiliza el patrón del Deployment skirmbooks-invoicing-ocr (mismo configmap y
# mismos credenciales proyectados) y del Job de migraciones (restartPolicy Never,
# backoffLimit 0, encaje amd64/edge, harbor-pull).
#
# Nombre NUEVO (…-real-20261003): .spec.template es inmutable y ArgoCD no recrea
# un Job existente por cambio de spec; este manifiesto define SOLO el Job real (el
# dry-run viejo queda fuera del repo; su objeto ya Completed se podrá podar a
# mano o con prune). ttlSecondsAfterFinished 7 días: el Job y su log sobreviven
# la verificación de qa y luego se autorrecoloca solo (no queda huérfano).
# Idempotencia: las ya classified salen `skipped`; repetir es inocuo.
#

# NO es hook de ArgoCD: recurso normal, corre al crearse el sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: skirmbooks-redrive-received-real-2-20261003
  namespace: skirmshop
  labels:
    app.kubernetes.io/name: skirmbooks
    app.kubernetes.io/component: redrive-received
    e-dani.com/portfolio: skirmshop
    e-dani.com/part-of: skirmbooks
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800  # 7 días: log legible por qa, luego autolimpieza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skirmbooks
        app.kubernetes.io/component: redrive-received
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                  - key: topology
                    operator: NotIn
                    values:
                      - lan
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: redrive
          image: harbor.e-dani.com/homelab/skirmbooks-backend:ingest-event-20261003-2@sha256:8c3a7b6f8893754dc24df9f8eb72d779a869f473c899c24aab99e326e2de745e
          command: ["python", "-m", "synapse_adapter_invoicing.redrive_received"]
          env:
            # Defaults del módulo: GESTORIA_CFG=/etc/synapse/adapter-gestoria-invoicing.yaml,
            # GESTORIA_CREDS=/etc/synapse/credentials (montajes abajo, como en
            # skirmbooks-invoicing-ocr).
            - name: FACTURAS_TENANT
              value: skirmshop
            - name: REDRIVE_DRY_RUN
              value: "0"  # pasada real: publica el evento de re-drive
            - name: REDRIVE_INVOICE_IDS
              value: >-
                75b31380-fd1d-4fb1-afa7-c04e19930598,e203aaaf-e972-400c-836a-551dfdf3cea2,9d32d0e3-86e6-4452-8255-67e280d50867,9e877220-a4a0-4711-a89a-78883deb8a39,9bb58ac7-2403-45dc-946b-ff88fdb7f281
            # S3 (InvoiceArtifactStore) — mismo secret que el adapter invoicing-ocr
            # (clave propia MinIO, 4ec072d).
            - name: S3_ENDPOINT
              value: http://skirmshop-drive-s3.backup-hub.svc.cluster.local:9000
            - name: S3_BUCKET
              value: skirmshop-drive
            - name: S3_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: skirmshop-drive-s3-skirmbooks
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: skirmshop-drive-s3-skirmbooks
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/synapse/adapter-gestoria-invoicing.yaml
              subPath: adapter-gestoria-invoicing.yaml
              readOnly: true
            - name: credentials
              mountPath: /etc/synapse/credentials
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: skirmbooks-invoicing-config
            items:
              - key: adapter-gestoria-invoicing.yaml
                path: adapter-gestoria-invoicing.yaml
        - name: credentials
          projected:
            defaultMode: 292
            sources:
              - secret:
                  name: skirmbooks-backend-secrets
              - secret:
                  name: skirmbooks-provider-credentials
                  optional: true
