# KEDA autoscaler for the Picqer inventory-valuation adapter worker (NEW).
#
# Clone of keda-skirmbooks-reporting-cashflow EXCEPT: name/labels, target,
# queueName regex, minReplicaCount, maxReplicaCount.
#
# minReplicaCount: 0 — this is a batch profile (monthly value_snapshot plus the
# one-off backfill_wac); nothing is waiting on it, so a cold start is free. The
# durable inventory queue survives having zero consumers (auto_delete=false, no
# x-expires), KEDA sees its depth over the management API and scales 0 -> 1.
# Cold start measured across this fleet: 46-89 s. maxReplicaCount capped at 3.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-skirmbooks-reporting-inventory
  namespace: skirmshop
  labels:
    app.kubernetes.io/part-of: synapse
    synapse.io/adapter: reporting
    synapse.io/worker-profile: inventory
spec:
  scaleTargetRef:
    name: skirmbooks-reporting-inventory
  pollingInterval: 60
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 3
  triggers:
  - type: rabbitmq
    metadata:
      protocol: http
      mode: QueueLength
      value: '1'
      queueName: ^adapter\.reporting\.inventory\.(value_snapshot|backfill_wac)$
      useRegex: "true"
      activationQueueLength: '1'
      operation: sum
    authenticationRef:
      name: skirmbooks-rabbitmq-http
