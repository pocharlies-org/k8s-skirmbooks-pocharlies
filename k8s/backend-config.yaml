  name: skirmbooks-identity-config
  namespace: skirmshop
data:
  adapter-gestoria-identity.yaml: "service: synapse-adapter-gestoria-identity\nlogging:\n\
    \  level: INFO\n  format: json\nmetrics:\n  enabled: true\n  port: 9521\ndatabase:\n\
    \  dsn: postgresql://gestoria_identity_app@postgres-shared-rw.databases.svc.cluster.local:5432/skirmbooks\n\
    \  min_size: 2\n  max_size: 8\nrabbitmq:\n  url: amqp://synapse_adapter_gestoria_identity@synapse-rmq.databases.svc.cluster.local:5672/%2Fsynapse\n\
    certificates:\n  credentials_dir: /etc/synapse/credentials\n  expiry_alert_days:\n\
