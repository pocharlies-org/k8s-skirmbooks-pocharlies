apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-invoicing-config
  namespace: skirmshop
data:
  adapter-gestoria-invoicing.yaml: |
    service: synapse-adapter-gestoria-invoicing
    logging:
      level: INFO
      format: json
    metrics:
      enabled: true
      port: 9523
    database:
      dsn: postgresql://gestoria_invoicing_app@postgres-shared-rw.databases.svc.cluster.local:5432/skirmbooks
      min_size: 2
      max_size: 10
    rabbitmq:
      url: amqp://synapse_adapter_gestoria_invoicing@synapse-rmq.databases.svc.cluster.local:5672/%2Fsynapse
    litellm:
      base_url: http://litellm.litellm.svc.cluster.local:4000/v1
      text_model: tooling
      vision_model: tooling
      timeout_s: 120
      max_images_per_pdf: 8
    vision_studio:
      enabled: true
      base_url: http://dgx-dashboard-backend.control-nexus.svc.cluster.local:9002
      # 900 s y no 1800: hasta ahora este bloque era inerte (el código que lo lee
      # no estaba desplegado). Con el escalado ya vivo, cada espera bloquea al
      # consumidor que la pide, y vision-deep arranca bajo demanda en DGX2 con
      # lease de GPU — donde el árbitro puede desalojarlo. 15 min cubren de sobra
      # un arranque en frío y acotan el atasco si el workload no llega a subir.
      hq_timeout_s: 900
      hq_poll_s: 5
      confidence_threshold: 0.85
    storage:
      backend: s3
      endpoint: http://skirmshop-drive-s3.backup-hub.svc.cluster.local:9000
      bucket: skirmshop-drive
      region: us-east-1
      prefix: skirmbooks/invoicing
      access_key_env: AWS_ACCESS_KEY_ID
      secret_key_env: AWS_SECRET_ACCESS_KEY
      secure: false
      root: /var/lib/synapse/gestoria/invoicing
      pdf_dpi: 200
      image_format: png
    gmail:
      mailbox: info@e-dani.com
      mailboxes:
        moreno: me@e-dani.com
    orphan_request:
      timeout_days: 14
    docintake_gate:
      enabled: true
    tenants:
    - skirmshop
    - moreno
    ovh:
      enabled: true
      default_endpoint: ovh-eu
      timeout_s: 60.0
      date_window_days: 5
      max_decompressed_bytes: 52428800
---
