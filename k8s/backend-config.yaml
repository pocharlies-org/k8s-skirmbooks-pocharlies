apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-accounting-config
  namespace: skirmshop
data:
  adapter-gestoria-accounting.yaml: "service: synapse-adapter-gestoria-accounting\n\
    logging:\n  level: INFO\n  format: json\nmetrics:\n  enabled: true\n  port: 9524\n\
    database:\n  dsn: postgresql://gestoria_accounting_app@postgres-shared-rw.databases.svc.cluster.local:5432/skirmbooks\n\
    \  min_size: 2\n  max_size: 10\nrabbitmq:\n  url: amqp://synapse_adapter_gestoria_accounting@synapse-rmq.databases.svc.cluster.local:5672/%2Fsynapse\n\
    retention:\n  enabled: true\n  archive_after_years: 7\n  s3:\n    bucket: skirmshop-gestoria-archive\n\
    \    prefix: accounting/\n    region: eu-west-1\n    enabled: false\ntenants:\n\
    - skirmshop\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-banking-config
  namespace: skirmshop
data:
  adapter-gestoria-banking.yaml: "service: synapse-adapter-gestoria-banking\nlogging:\n\
    \  level: INFO\n  format: json\nmetrics:\n  enabled: true\n  port: 9522\ndatabase:\n\
    \  dsn: postgresql://gestoria_banking_app@postgres-shared-rw.databases.svc.cluster.local:5432/skirmbooks\n\
    \  min_size: 2\n  max_size: 10\nrabbitmq:\n  url: amqp://synapse_adapter_gestoria_banking@synapse-rmq.databases.svc.cluster.local:5672/%2Fsynapse\n\
    psd2:\n  aggregator: enable_banking\n  base_url: https://api.enablebanking.com\n\
    \  initial_history_days: 90\n  daily_lookback_days: 7\nstripe:\n  api_key_credential:\
    \ stripe.api_key\n  webhook_secret_credential: stripe.webhook_secret\npaypal:\n\
    \  client_id_credential: paypal.client_id\n  client_secret_credential: paypal.client_secret\n\
    \  webhook_id_credential: paypal.webhook_id\nmatching:\n  tier1_date_window_days:\
    \ 3\n  tier2_date_window_days: 15\n  tier2_amount_tolerance_pct: 0.01\n  tier2_auto_threshold:\
    \ 0.95\n  tier2_suggest_threshold: 0.7\n  tier2_weights_name: 0.3\n  tier2_weights_amount:\
    \ 0.3\n  tier2_weights_date: 0.2\n  tier2_weights_concept: 0.2\n  subset_sum_max_invoices:\
    \ 6\ntransfer_detection:\n  enabled: true\n  date_window_days: 2\n  amount_tolerance:\
    \ 0.01\ntenants:\n- skirmshop\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-fiscal-validator-config
  namespace: skirmshop
data:
  adapter-gestoria-fiscal-validator.yaml: "service: synapse-adapter-gestoria-fiscal-validator\n\
    logging:\n  level: INFO\n  format: json\nmetrics:\n  enabled: true\n  port: 9526\n\
    database:\n  dsn: postgresql://gestoria_fiscal_validator_app@postgres-shared-rw.databases.svc.cluster.local:5432/skirmbooks\n\
    \  min_size: 2\n  max_size: 6\nrabbitmq:\n  url: amqp://synapse_adapter_gestoria_fiscal_validator@synapse-rmq.databases.svc.cluster.local:5672/%2Fsynapse\n\
    litellm:\n  base_url: http://litellm.litellm.svc.cluster.local:4000/v1\n  primary_model:\
    \ tooling\n  smart_model: smart\n  fast_model: fast\n  cloud_fallback: cb-gpt-4o-mini\n\
    \  timeout_s: 60.0\n  use_prompt_caching: true\n  use_redis_prefix_cache_fallback:\
    \ true\ncorpus:\n  path: /app/fiscal-corpus/built.txt\n\
    \  version: v1\ncircuit_breaker:\n  max_consecutive_failures: 5\n  half_open_after_seconds:\
    \ 30\nthresholds:\n  auto_min: 0.95\n  suggest_min: 0.7\nredis:\n  host: skirmbooks-redis.skirmshop.svc.cluster.local\n\
    \  port: 6379\n  db: 7\n  ttl_seconds: 86400\ntenants:\n- skirmshop\n"
---
apiVersion: v1
