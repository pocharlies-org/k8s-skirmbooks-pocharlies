apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-tax-config
  namespace: skirmshop
data:
  adapter-gestoria-tax.yaml: |
    service: synapse-adapter-gestoria-tax
    logging:
      level: INFO
      format: json
    metrics:
      enabled: true
      port: 9525
    database:
      dsn: postgresql://gestoria_tax_app@postgres-shared-rw.databases.svc.cluster.local:5432/skirmbooks
      min_size: 2
      max_size: 10
    rabbitmq:
      url: amqp://synapse_adapter_gestoria_tax@synapse-rmq.databases.svc.cluster.local:5672/%2Fsynapse
    aeat:
      # Fase B: 303 por cable contra AEAT PRE (environment test => prewww1).
      # Endpoints PresBasicaDos/ServValiDos = defaults de config.py.
      environment: test
      request_timeout_s: 180.0
      modelo_modes:
        "303": wire
    calendar:
      base_url: https://gestoria.skirmshop.es
    tenants:
    - skirmshop
