apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-sii-inbound-config
  namespace: skirmshop
data:
  # NOTA aeat.environment: el PUSH de NUESTRO libro (push_recibida/reconcile vs
  # nuestro espejo) históricamente iba a PRE (Talenom). El import_recibidas lee el
  # LIBRO REMOTO REAL de la gestoría, que vive en PRODUCCIÓN → environment: production
  # (cert sii-certificate verificado vs PROD, handshake mTLS OK 2026-06-24).
  # titular = SKIRMSHOP SPAIN SL / B02642775 (clave de dedupe del ledger).
  adapter-gestoria-sii-inbound.yaml: |
    service: synapse-adapter-gestoria-sii-inbound
    logging:
      level: INFO
      format: json
    metrics:
      enabled: true
      port: 9530
    database:
      dsn: postgresql://gestoria_sii_inbound_app@postgres-shared-rw.databases.svc.cluster.local:5432/skirmbooks
      min_size: 1
      max_size: 4
    rabbitmq:
      url: amqp://synapse_adapter_gestoria_sii_inbound@synapse-rmq.databases.svc.cluster.local:5672/%2Fsynapse
    aeat:
      environment: production
      titular_nif: B02642775
      titular_nombre: SKIRMSHOP SPAIN SL
    tenants:
    - skirmshop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: skirmbooks-tax-config
  namespace: skirmshop
data:
  adapter-gestoria-tax.yaml: |
    service: synapse-adapter-gestoria-tax
    logging:
      level: INFO
      format: json
    metrics:
      enabled: true
      port: 9525
    database:
      dsn: postgresql://gestoria_tax_app@postgres-shared-rw.databases.svc.cluster.local:5432/skirmbooks
      min_size: 2
      max_size: 10
    rabbitmq:
      url: amqp://synapse_adapter_gestoria_tax@synapse-rmq.databases.svc.cluster.local:5672/%2Fsynapse
    aeat:
      # Fase C: 303 por cable contra AEAT PRODUCCIÓN (environment prod => www1).
      # Cert sii-certificate verificado vs PROD (handshake mTLS OK 2026-06-24).
      # NO hay auto-submit: la presentación real es manual (UI, draft approved +
      # botón "Presentar" con confirm). ServValiDos pre-valida cada F01.
      # SII libros registro sigue en PRE (skirmbooks-sii-inbound-config) — Talenom.
      environment: prod
      request_timeout_s: 180.0
      modelo_modes:
        "303": wire
    calendar:
      base_url: https://gestoria.skirmshop.es
    tenants:
    - skirmshop
