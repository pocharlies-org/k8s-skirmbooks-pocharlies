# skirmbooks-ui-secrets ← Vault  (ESO-managed, replaces the manual Opaque secret)
# =============================================================================
# PURPOSE
#   Materialises the k8s Secret `skirmshop/skirmbooks-ui-secrets` from Vault KV
#   v2 path `skirmshop/skirmbooks-ui` (read as `secret/skirmshop/skirmbooks-ui`).
#   The skirmbooks-ui Deployment consumes this Secret via `envFrom.secretRef`
#   (manifest.yaml). It holds SESSION_SECRET — the HMAC root of EVERY session +
#   the signed `sb_tenant` cookie. With AUTH_ENABLED=true the pod is fail-closed:
#   if SESSION_SECRET is missing/empty the UI will NOT start (C3). Therefore this
#   ExternalSecret MUST publish all 5 keys, never a subset.
#
# ADOPTION OF THE MANUAL SECRET (project_vault_break_glass_eso)
#   creationPolicy: Owner  → ESO takes ownership of the existing Secret of the
#   same name (sets ownerReference=ExternalSecret + the managed label/annotation).
#   It does NOT delete-and-recreate; it patches in place. The existing
#   `kubectl.kubernetes.io/last-applied-configuration` annotation is harmless and
#   will be reconciled away on the next ESO write.
#
#   *** ZERO-DROP REQUIREMENT ***
#   We use dataFrom.extract (pull EVERY key under the path), identical to the
#   working `skirmbooks-backend-secrets`. This guarantees: whatever set of keys
#   exists in Vault is published verbatim. The PMO MUST verify (before this object
#   reconciles against the live secret) that Vault path `skirmshop/skirmbooks-ui`
#   already contains exactly the 5 keys with identical values — otherwise ESO
#   could publish a smaller set and the UI would lose keys / fail to boot.
#   Apply order is enforced in ../docs/ui-secrets-vault-runbook.md.
#
#   SEED METHOD (do this FIRST): ../docs/seed-ui-secrets-to-vault.sh with a Vault
#   break-glass token. NOTE (proven 2026-06-21): an ESO PushSecret to this path
#   does NOT work — the ESO Vault role has no write on secret/skirmshop/* (403);
#   it can only write secret/skirmshop-drive/*. Seeding is therefore break-glass,
#   not GitOps. The READ below IS permitted by the ESO role.
#
# deletionPolicy: Retain → deleting this ExternalSecret leaves the Secret intact
#   (no UI outage on accidental delete).
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmbooks-ui-secrets
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: skirmbooks-ui-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    # template.mergePolicy defaults to Replace; with dataFrom.extract this means
    # the Secret data == the full key set found in Vault. That is exactly what we
    # want: an authoritative mirror of `secret/skirmshop/skirmbooks-ui`.
  dataFrom:
    - extract:
        key: secret/skirmshop/skirmbooks-ui
