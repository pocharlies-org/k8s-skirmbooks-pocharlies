# =============================================================================
# skirmbooks-billing-secrets ← 1Password  (ESO-managed, dominio BILLING — claves PROPIAS)
# =============================================================================
# PURPOSE
#   Materialises the k8s Secret `skirmshop/skirmbooks-billing-secrets` from the
#   1Password item `skirmshop-skirmbooks-billing` (vault `k8s-pocharlies`), read
#   via ClusterSecretStore/onepassword (patrón SC-496). El Deployment
#   skirmbooks-billing lo consume vía envFrom.secretRef (billing-deployment.yaml).
#
#   Claves esperadas (las SIEMBRA quien active el servicio con el CLI `op` cuando
#   entregue las claves de TEST de la cuenta Stripe SaaS — son DISTINTAS del
#   Stripe bancario; ver docs/p4-billing/billing-deploy-plan.md §2):
#     - STRIPE_SECRET_KEY              (sk_test_… — sólo vive aquí, server-side)
#     - STRIPE_PUBLISHABLE_KEY         (pk_test_… — la UI la sirve al navegador)
#     - STRIPE_WEBHOOK_SIGNING_SECRET  (whsec_… — verificación HMAC del webhook)
#     - STRIPE_PRICE_TRIAL             (price_… plan Trial)
#     - STRIPE_PRICE_STARTER           (price_… plan Starter)
#     - STRIPE_PRICE_STANDARD          (price_… plan Standard)
#     - STRIPE_PRICE_PRO               (price_… plan Pro)
#     - GESTORIA_DB_URL                (DSN del role gestoria_billing_app — ver
#                                       plan de role en docs/billing-deploy-plan.md)
#
# ESTADO INICIAL: EL ITEM 1PASSWORD NO EXISTE TODAVÍA (SC-498: la ruta
#   `secret/skirmshop/skirmbooks-billing` nunca llegó a poblarse en Vault y no
#   está en mapping.tsv — el item se CREA en la activación, no se migra).
#   ESO no podrá extraer datos → el ExternalSecret quedará NotReady
#   (SecretSyncError / "path not found"). Eso es ESPERADO y NO debe tumbar el pod:
#     - El Deployment usa `secretRef ... optional: true`, así que la AUSENCIA del
#       Secret no impide el arranque del pod (k8s no exige que exista).
#     - El servicio billing arranca fail-safe (sin sk_* → /healthz 200 pero
#       /billing/* → 503). Inerte, no roto. (Implementación lane backend.)
#   Cuando se siembre el item con `op`, ESO reconcilia (refreshInterval 1h
#   o un `kubectl annotate ... force-sync`) y el Secret se puebla → el pod recoge
#   las claves en el siguiente rollout/restart (envFrom se lee al arrancar el
#   contenedor; tras sembrar, hacer `kubectl rollout restart deploy/skirmbooks-billing`).
#
# ZERO-DROP / AISLAMIENTO
#   dataFrom.extract publica VERBATIM el conjunto de campos que haya en el item —
#   mismo patrón probado en ui-secrets-external.yaml y skirmbooks-backend-secrets.
#   El item es EXCLUSIVO de billing (no comparte con skirmbooks-ui ni con el
#   Stripe bancario) → aislamiento de credenciales del §6 del diseño.
#
# PERMISOS (SC-496): ESO solo LEE el item — no hay write path a 1Password desde
#   el clúster (igual que el role `vault-backend` no podía escribir
#   `secret/skirmshop/*`, 403 probado 2026-06-21) → el seed es con el CLI `op`
#   en sesión firmada, no GitOps.
#
# deletionPolicy: Retain → borrar este ExternalSecret deja el Secret intacto.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmbooks-billing-secrets
  namespace: skirmshop
  labels:
    app.kubernetes.io/part-of: skirmbooks
    e-dani.com/component: skirmbooks-billing
    synapse.io/domain: billing
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: skirmbooks-billing-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    # Sin template: mientras el item no exista, ESO no crea el Secret y el pod
    # depende del `optional: true` del envFrom. Esto es deliberado — evitamos
    # sembrar valores placeholder que el servicio pudiera confundir con claves
    # reales (un STRIPE_SECRET_KEY="" parece configurado; mejor AUSENTE → el
    # fail-safe del backend detecta la ausencia y devuelve 503 limpio).
  dataFrom:
    - extract:
        key: skirmshop-skirmbooks-billing
